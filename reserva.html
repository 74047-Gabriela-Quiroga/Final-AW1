<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Córdoba Turismo | Reserva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
  <nav class="container d-flex justify-content-between align-items-center p-3">
    <h1 class="h4 m-0">Córdoba Turismo</h1>
    <div>
      <a href="index.html#inicio" class="me-4">Inicio</a>
      <a href="index.html#sobre" class="me-4">Nosotros</a>
      <a href="destinos.html" class="me-4">Destinos</a>
      <a href="reserva.html" class="me-4">Reserva</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>
</header>

<main class="container mt-5">
  <section class="row justify-content-center">
    <div class="col-md-6">

      <h2 class="mb-4 text-center">Formulario de Reserva</h2>

      <form id="formReserva" class="form-card">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Destino</label>
          <select id="destino" class="form-select" required></select>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad de Personas</label>
          <input type="number" id="personas" class="form-control" min="1" max="20" required>
        </div>

        <div class="form-check mb-3">
          <input type="checkbox" id="seguro" class="form-check-input">
          <label class="form-check-label">
            Seguro de viaje (+$5000)
          </label>
        </div>

        <h5>Total: $<span id="total">0</span></h5>

        <button type="submit" class="btn-confirmar w-100 mt-3">
          Confirmar Reserva
        </button>

        <div id="mensaje" class="mt-3"></div>

      </form>

    </div>
  </section>
</main>

<footer class="text-center">
  © 2026 Córdoba Turismo - Desarrollo: Quiroga - AW1
</footer>

<script type="module" src="js/pages/reservaPage.js"></script>

</body>
</html>
